[package]
name = "tree-sitter-snowflake-sql"
description = "Tree-sitter Grammar for Snowflake SQL"
version = "0.1.0"
authors = ["derek stride", "hectron"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "sql", "snowflake"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/hectron/tree-sitter-snowflake-sql.git"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = ["/LICENSE", "bindings/rust/*", "grammar*", "queries/*", "src/*"]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "~1.2.1"

[dev-dependencies]
tree-sitter = "~0.25.0"
